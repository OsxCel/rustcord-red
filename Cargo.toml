[package]
name = "MortexApp_backend"
version = "0.1.0"
edition = "2024"

[dependencies]
# Web framework ve WebSocket desteği
axum = { version = "0.7", features = ["ws"] }

# Asenkron çalışma motoru (Tokio)
tokio = { version = "1.0", features = ["full"] }

# JSON veri dönüştürme paketleri (Serde)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Static file serving
tower-http = { version = "0.5", features = ["fs"] }

# WebSocket veri akışı (Futures)
futures-util = "0.3"

# Cloudflare Turnstile token verification
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
argon2 = "0.5"
rand = "0.8"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
